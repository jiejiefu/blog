baseURL: "https://jiejiefu.github.io/blog/"
title: "Jay Fu Blog"
theme: "PaperMod"

pagination:
  pagerSize: 10

outputs:
    home:
        - HTML
        - RSS
        - JSON # necessary for search

params:
  env: production
  defaultTheme: "light"
  title: Jay Fu Blog
  description: Algorithm | Edge Computing | Software Engineer
  author: Jay Fu

  # 網站圖示（static/favicon*、apple-touch-icon.png、android-chrome-*.png）。
  # 路徑沿用 PaperMod head.html 的預設檔名，不需要另外指定。
  assets:
    theme_color: "#0B1220"
    msapplication_TileColor: "#0B1220"

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true

  ShowFullTextinRSS: true
  displayFullLangName: false # 設定為 true 會顯示 "English"，false 則可能顯示 "EN"

  profileMode:
    enabled: false
    title: "Jay Fu"
    subtitle: "Machine Learning | Edge Computing"

  # ⚠️ 首頁自我介紹已改由 layouts/index.html + data/home.yaml 渲染，
  # homeInfoParams 不再使用（PaperMod 的 home_info.html 只會被
  # _default/list.html 呼叫，而首頁現在走 layouts/index.html）。
  # ⚠️ 舊的 homeInfoParams 內容裡有 4 個死鏈，已全數移除：
  #   /resume/ 與 /projects/ 都是 draft: true，正式 build 是 404
  #   /tags/edge-computing/ 與 /tags/ai-applications/ 這兩個 tag 不存在
  # 站上實際存在的 tag：edge-ai / machine-learning / system-design / ai-agent 等。
  # 頂部選單的 Projects / Resume 連結同樣是 404（待 projects 頁寫完再處理）。

  socialIcons:
    - name: GitHub
      url: "https://github.com/jiejiefu"

  ShowTableOfContents: true
  HighlightStyle: "monokai"
  ## Footer: "© 2026 Jay Fu"

  # hideCopyright: false      # 🔹 必須
  # ShowCodeCopyButtons: true # 🔹 必須

  cover:
      responsiveImages: true  # 自動產生不同大小的圖片以優化載入速度（建議開啟）
      linkFullImages: true    # 點擊文章封面圖時，是否跳轉開啟原圖
      hidden: false           # 是否在文章內頁隱藏封面（僅在列表頁顯示）
      hiddenInList: false     # 是否在列表頁隱藏封面（僅在文章內頁顯示）


# 預設語言
defaultContentLanguage: zh-tw
hasCJKLanguage: true # 修正中文內容字數統計與搜尋

languages:
  zh-tw:
    label: "繁體中文"
    contentDir: content/zh-tw  # 中文內容存放路徑
    weight: 1
    title: Jay Fu 的科技部落格
    params:
      description: "演算法 | 邊緣運算 | 軟體工程師"

  en:
    label: "English"
    contentDir: content/en     # 英文內容存放路徑
    weight: 2
    title: Jay Fu's Tech Blog
    params:
      description: "Algorithm | Edge Computing | Software Engineer"

menu:
  main:
    - identifier: posts
      name: Posts
      url: posts/
      weight: 10

    - identifier: projects
      name: Projects
      url: projects/
      weight: 20

    - identifier: resume
      name: Resume
      url: resume/
      weight: 30

    - identifier: search
      name: "🔍 Search"  # 或是寫 "搜尋"
      url: search/       # 對應到我們下一步要建立的文章路徑
      weight: 50


markup:
  highlight:
    noClasses: false # 改用 class-based 高亮，配色由 assets/css/extended/chroma-*.css 提供（淺色 Atom One Light／深色 Tokyo Night，分流）
  goldmark:
    extensions:
      passthrough:
        enable: true # 數學語法：將 $$...$$ 與 \(...\) 原樣輸出，交由 KaTeX auto-render 渲染
        delimiters:
          block:
            - ['$$', '$$']
          inline:
            - ['\(', '\)']
    renderer:
      unsafe: true # 允許在 Markdown 中直接使用 HTML 標籤
