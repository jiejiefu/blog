baseURL: "https://jiejiefu.github.io/blog/"
title: "Jay Fu Blog"
theme: "PaperMod"

pagination:
  pagerSize: 10

outputs:
    home:
        - HTML
        - RSS
        - JSON # necessary for search

params:
  env: production
  defaultTheme: "light"
  title: Jay Fu Blog
  description: Algorithm | Edge Computing | Software Engineer
  author: Jay Fu

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true

  ShowFullTextinRSS: true
  displayFullLangName: false # 設定為 true 會顯示 "English"，false 則可能顯示 "EN"

  profileMode:
    enabled: false
    title: "Jay Fu"
    subtitle: "Machine Learning | Edge Computing"

  homeInfoParams:
    Title: "Hello 👋"
    AlignSocialIconsTo: center
    Content: |
      軟體工程師，專注於機器學習與邊緣運算的整合應用，熱衷於智慧數據視覺化。

      歡迎來到我的數位花園，探索演算法、邊緣運算與軟體工程筆記。

      [All Posts](/posts/) · [Resume](/resume/) · [Projects](/projects/)

  socialIcons:
    - name: GitHub
      url: "https://github.com/jiejiefu"

  ShowTableOfContents: true
  HighlightStyle: "monokai"
  ## Footer: "© 2026 Jay Fu"

  # hideCopyright: false      # 🔹 必須
  # ShowCodeCopyButtons: true # 🔹 必須

  cover:
      responsiveImages: true  # 自動產生不同大小的圖片以優化載入速度（建議開啟）
      linkFullImages: true    # 點擊文章封面圖時，是否跳轉開啟原圖
      hidden: false           # 是否在文章內頁隱藏封面（僅在列表頁顯示）
      hiddenInList: false     # 是否在列表頁隱藏封面（僅在文章內頁顯示）


# 預設語言
defaultContentLanguage: zh-tw
hasCJKLanguage: true # 修正中文內容字數統計與搜尋

languages:
  zh-tw:
    languageName: "繁體中文"
    contentDir: content/zh-tw  # 中文內容存放路徑
    weight: 1
    title: Jay Fu 的科技部落格
    params:
      description: "演算法 | 邊緣運算 | 軟體工程師"
      homeInfoParams:
        Title: "你好，我是Jay 👋"
        AlignSocialIconsTo: center
        Content: |
          軟體工程師，專注於機器學習與邊緣運算的整合應用，熱衷於智慧數據視覺化。

          歡迎來到我的數位花園，探索演算法、邊緣運算與軟體工程筆記。

          [All Posts](/posts/) · [Resume](/resume/) · [Projects](/projects/)

  en:
    languageName: "English"
    contentDir: content/en     # 英文內容存放路徑
    weight: 2
    title: Jay Fu's Tech Blog
    params:
      description: "Algorithm | Edge Computing | Software Engineer"
      homeInfoParams:
        Title: "Hello, I'm Jay 👋"
        AlignSocialIconsTo: center
        Content: |
          Software Engineer in the semiconductor industry, focused on integrating **machine learning** and **edge computing**, with a passion for **smart data visualization**.

          Welcome to my digital garden — notes on algorithms, edge computing, and software engineering.

          [All Posts](/posts/) · [Resume](/resume/) · [Projects](/projects/)

menu:
  main:
    - identifier: posts
      name: Posts
      url: posts/
      weight: 10

    - identifier: projects
      name: Projects
      url: projects/
      weight: 20

    - identifier: resume
      name: Resume
      url: resume/
      weight: 30

    - identifier: search
      name: "🔍 Search"  # 或是寫 "搜尋"
      url: search/       # 對應到我們下一步要建立的文章路徑
      weight: 50


markup:
  goldmark:
    renderer:
      unsafe: true # 允許在 Markdown 中直接使用 HTML 標籤
