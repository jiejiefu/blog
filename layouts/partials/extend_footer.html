<script src="https://cdn.jsdelivr.net/npm/aos@2.3.1/dist/aos.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        AOS.init({
            duration: 800, // 動畫持續時間 (ms)
            once: true,    // 是否只觸發一次（向下捲動再向上時不重複動畫）
            offset: 100,   // 觸發動畫的偏移量
        });
    });
</script>
{{- /* 分享連結的複製功能。
       ⚠️ 必須用 .RelPermalink / .Permalink 取得網址。
       直接寫 {{ . | minify | fingerprint }} 會輸出「來源」路徑
       （/js/share-link.js，檔案根本不存在），不會是加工後的指紋檔名。 */}}
{{- with resources.Get "js/share-link.js" }}
{{- $js := . | minify | fingerprint }}
<script src="{{ $js.RelPermalink }}" defer></script>
{{- end }}
