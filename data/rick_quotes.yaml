#
# 規則：
#   1. 只收錄可考證的原作台詞（不確定集數就留空，不要硬猜）。
#   2. 不收 F-word 與粉絲仿寫；引用一律保留 attribution。
#   3. handle 是用來假裝成觀眾帳號的裝飾，不需要對應真實帳號。
