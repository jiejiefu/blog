    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#5ef2a0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7cff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8b7cff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="2400" height="1260" fill="#0a0a0f"/>
