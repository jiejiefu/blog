  <text x="1460" y="766" font-family="'JetBrains Mono','Menlo',monospace" font-size="26" fill="#c0c0d0">checkout (submodules)</text>

  <text x="1420" y="814" font-family="'JetBrains Mono','Menlo',monospace" font-size="24" fill="#5ef2a0">✓</text>
  <text x="1460" y="814" font-family="'JetBrains Mono','Menlo',monospace" font-size="26" fill="#c0c0d0">hugo extended</text>

  <text x="1420" y="862" font-family="'JetBrains Mono','Menlo',monospace" font-size="24" fill="#5ef2a0">✓</text>
  <text x="1460" y="862" font-family="'JetBrains Mono','Menlo',monospace" font-size="26" fill="#c0c0d0">hugo --minify</text>

  <text x="1420" y="910" font-family="'JetBrains Mono','Menlo',monospace" font-size="24" fill="#5ef2a0">✓</text>
  <text x="1460" y="910" font-family="'JetBrains Mono','Menlo',monospace" font-size="26" fill="#c0c0d0">gh-pages</text>

  <line x1="1420" y1="956" x2="2220" y2="956" stroke="#22222e" stroke-width="2"/>

  <text x="1420" y="1022" font-family="'JetBrains Mono','Menlo',monospace" font-size="28" fill="#5ef2a0">✓ published to gh-pages</text>
  <text x="1420" y="1068" font-family="'JetBrains Mono','Menlo',monospace" font-size="26" fill="#9a9aae">jiejiefu.github.io/blog</text>
