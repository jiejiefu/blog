  <circle cx="420" cy="540" r="520" fill="url(#glow)"/>

  <!-- window shadow + frame -->
  <rect x="132" y="100" width="2160" height="1100" rx="26" fill="#000000" opacity="0.45"/>
  <rect x="120" y="80" width="2160" height="1100" rx="26" fill="#0d0d14" stroke="#2a2a38" stroke-width="2"/>

