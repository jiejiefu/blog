<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Jev — System One Model</title>
  <desc>Terminal-style cover for a concise deep dive into Jev, TypeSafe AI's decision model that returns typed answers instead of text.</desc>

  <rect width="1200" height="630" fill="#0A0A0A"/>
  <pattern id="dotgrid" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#FFFFFF" opacity="0.06"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dotgrid)"/>

  <rect x="64" y="56" width="1072" height="518" rx="12" fill="#121412" stroke="#2A2E2A" stroke-width="1"/>
  <path d="M64 68a12 12 0 0 1 12-12h1048a12 12 0 0 1 12 12v36H64z" fill="#191C19"/>
  <line x1="64" y1="104" x2="1136" y2="104" stroke="#2A2E2A"/>

  <circle cx="92" cy="80" r="5" fill="#7EE787"/>
  <circle cx="116" cy="80" r="5" fill="#555B55"/>
  <circle cx="140" cy="80" r="5" fill="#555B55"/>
  <text x="164" y="85" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="14" fill="#9AA39A">jev — system one model</text>

  <circle cx="1052" cy="80" r="4" fill="#7EE787"/>
  <text x="1064" y="85" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="11" letter-spacing="2" fill="#9AA39A">LIVE</text>

  <text x="104" y="154" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="17"><tspan fill="#7EE787">$</tspan><tspan fill="#F5F5F5" dx="8">jev decide --input state.json</tspan></text>

  <text x="100" y="302" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="128" font-weight="700" letter-spacing="2" fill="#F5F5F5">JEV</text>
  <rect x="106" y="320" width="198" height="4" fill="#7EE787"/>

  <text x="104" y="372" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="30" fill="#9AA39A">System One Model</text>
  <text x="104" y="417" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="27" font-weight="500" fill="#D7DDD7">不聊天，只做決定。</text>

  <rect x="104" y="446" width="94" height="34" rx="2" fill="#171A17" stroke="#7EE787"/>
  <text x="116" y="468" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="12" letter-spacing="1" fill="#7EE787">70–500 MS</text>

  <rect x="210" y="446" width="132" height="34" rx="2" fill="#171A17" stroke="#2A2E2A"/>
  <text x="222" y="468" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="12" letter-spacing="1" fill="#9AA39A">$0.042 / MTOK</text>

  <rect x="354" y="446" width="126" height="34" rx="2" fill="#171A17" stroke="#2A2E2A"/>
  <text x="366" y="468" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="12" letter-spacing="1" fill="#9AA39A">255 OPTIONS</text>

  <text x="104" y="536" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="15" fill="#7C857C">不生成文章，不接話，只回傳程式能直接使用的答案。</text>

  <line x1="648" y1="136" x2="648" y2="512" stroke="#2A2E2A"/>
  <text x="688" y="154" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="11" letter-spacing="3" fill="#6E776E">CHOICE · department</text>
  <text x="688" y="176" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="11" letter-spacing="1" fill="#4E574E">3 OPTIONS · 1 REQUEST</text>

  <g font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace">
    <text x="688" y="218" font-size="13" fill="#D7DDD7">returns</text>
    <text x="1032" y="218" font-size="13" fill="#7EE787" text-anchor="end">0.61</text>
    <rect x="688" y="228" width="344" height="14" rx="2" fill="#202520"/>
    <rect x="688" y="228" width="210" height="14" rx="2" fill="#7EE787"/>

    <text x="688" y="278" font-size="13" fill="#D7DDD7">billing</text>
    <text x="1032" y="278" font-size="13" fill="#9AA39A" text-anchor="end">0.35</text>
    <rect x="688" y="288" width="344" height="14" rx="2" fill="#202520"/>
    <rect x="688" y="288" width="120" height="14" rx="2" fill="#6E776E"/>

    <text x="688" y="338" font-size="13" fill="#D7DDD7">shipping</text>
    <text x="1032" y="338" font-size="13" fill="#9AA39A" text-anchor="end">0.04</text>
    <rect x="688" y="348" width="344" height="14" rx="2" fill="#202520"/>
    <rect x="688" y="348" width="14" height="14" rx="2" fill="#4E574E"/>
  </g>

  <line x1="688" y1="392" x2="1032" y2="392" stroke="#2A2E2A"/>
  <text x="688" y="418" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="11" letter-spacing="3" fill="#6E776E">CONFIDENCE</text>
  <text x="686" y="462" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="40" font-weight="700" fill="#F5F5F5">0.42</text>
  <rect x="688" y="480" width="344" height="8" rx="2" fill="#202520"/>
  <rect x="688" y="480" width="145" height="8" rx="2" fill="#7EE787"/>
  <line x1="860" y1="474" x2="860" y2="494" stroke="#4E574E"/>
  <line x1="997" y1="474" x2="997" y2="494" stroke="#4E574E"/>
  <text x="860" y="510" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="10" text-anchor="middle" fill="#4E574E">0.5</text>
  <text x="997" y="510" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="10" text-anchor="middle" fill="#4E574E">0.9</text>

  <text x="688" y="548" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="13" fill="#9AA39A">{ choice: <tspan fill="#7EE787">"returns"</tspan>, confidence: 0.42 }</text>
</svg>
