    <text x="760" y="254">0x0010  03 00 3E 00 01 00 00 00</text>
    <rect x="752" y="268" width="304" height="28" fill="#938BFF" opacity="0.10"/>
    <text x="760" y="286" fill="#938BFF">0x0018  40 00 00 00 00 00 00 00</text>
    <text x="760" y="312">0x0020  00 00 00 00 00 00 00 00</text>
    <text x="760" y="338">0x0028  00 00 00 00 00 00 00 00</text>
    <text x="760" y="364">0x0030  00 00 00 00 00 00 00 00</text>
    <text x="760" y="390">0x0038  00 00 00 00 00 00 00 00</text>
    <text x="760" y="416">0x0040  00 00 00 00 00 00 00 00</text>
    <text x="760" y="442">0x0048  00 00 00 00 00 00 00 00</text>
