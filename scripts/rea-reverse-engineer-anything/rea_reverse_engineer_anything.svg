  <text x="760" y="486" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="12" fill="#9A9A9A">evidence, not guesswork.</text>

  <circle cx="116" cy="537" r="4" fill="#938BFF"/>
  <text x="130" y="542" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="13" fill="#9A9A9A">331k stars</text>
  <text x="232" y="542" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="13" fill="#3F3F3F">/</text>
  <text x="250" y="542" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="13" fill="#9A9A9A">MIT</text>
  <text x="300" y="542" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="13" fill="#3F3F3F">/</text>
  <text x="318" y="542" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="13" fill="#9A9A9A">github.com/morluto/rea</text>
