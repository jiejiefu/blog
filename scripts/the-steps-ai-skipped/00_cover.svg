<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title>AI 把 Bug 修好了，我這工程師只剩 BI</title><desc>Original cover art: a dark terminal with a passing test suite and an unanswered question.</desc><defs><linearGradient id="gPanel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121D30"/><stop offset="1" stop-color="#0D1524"/></linearGradient><linearGradient id="gHeader" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#16213A"/><stop offset="1" stop-color="#101A2B"/></linearGradient><linearGradient id="gAmber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D08A38"/><stop offset="1" stop-color="#F5B84C"/></linearGradient><linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#5EEAD4"/></linearGradient><linearGradient id="gAccent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6F7BFF"/><stop offset="1" stop-color="#A5ABFF"/></linearGradient><radialGradient id="gVignette" cx="0.5" cy="0.28" r="0.85"><stop offset="0" stop-color="#1A2742" stop-opacity="0.55"/><stop offset="0.62" stop-color="#0B1220" stop-opacity="0"/><stop offset="1" stop-color="#04070D" stop-opacity="0.65"/></radialGradient><filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="630" fill="#0B1220"/><rect width="1200" height="630" fill="url(#gVignette)"/><pattern id="coverdots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#FFFFFF" opacity="0.055"/></pattern><rect width="1200" height="630" fill="url(#coverdots)"/><rect x="24" y="24" width="1152" height="582" rx="0" fill="none" stroke="#26354F" stroke-width="1" opacity="0.9"/><text x="64" y="92" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="13" font-weight="600" fill="#8B93FF" text-anchor="start" letter-spacing="3">ENGINEERING NOTES / 2026</text><text x="1136" y="92" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="12" font-weight="500" fill="#5D6E88" text-anchor="end" letter-spacing="2.4">FIELD NOTE 00</text><text x="64" y="194" font-family="'Noto Serif TC','Songti TC','Noto Serif CJK TC',serif" font-size="58" font-weight="700" fill="#E8EEF9" text-anchor="start">AI 把 Bug</text><text x="64" y="258" font-family="'Noto Serif TC','Songti TC','Noto Serif CJK TC',serif" font-size="58" font-weight="700" fill="#E8EEF9" text-anchor="start">修好了，</text><rect x="64" y="280" width="76" height="4" rx="2" fill="#8B93FF"/><text x="64" y="334" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="34" font-weight="500" fill="#93A4BE" text-anchor="start">我這工程師只剩</text><text x="58" y="470" font-family="'Noto Serif TC','Songti TC','Noto Serif CJK TC',serif" font-size="132" font-weight="700" fill="#8B93FF" text-anchor="start">BI</text><rect x="64" y="494" width="152" height="7" rx="3.5" fill="#8B93FF"/><text x="64" y="546" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="18" font-weight="400" fill="#93A4BE" text-anchor="start">效率、理解，與那些被跳過的步驟</text><text x="64" y="584" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="11" font-weight="500" fill="#5D6E88" text-anchor="start" letter-spacing="2.6">JAY FU</text><rect x="690" y="104" width="446" height="424" rx="14" fill="#0D1524" stroke="#26354F" stroke-width="1.4"/><rect x="690" y="104" width="446" height="46" rx="14" fill="#16213A"/><rect x="690" y="134" width="446" height="16" rx="0" fill="#16213A"/><circle cx="714" cy="127" r="5" fill="#FF6B72"/><circle cx="732" cy="127" r="5" fill="#F5B84C"/><circle cx="750" cy="127" r="5" fill="#5EEAD4"/><text x="1116" y="132" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="10.5" font-weight="400" fill="#5D6E88" text-anchor="end">zsh · 80×24</text><text x="714" y="196" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="15" font-weight="400" fill="#E8EEF9" text-anchor="start">$ pytest -q</text><text x="714" y="234" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="20" font-weight="700" fill="#5EEAD4" text-anchor="start" letter-spacing="3">..........</text><text x="714" y="266" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="13" font-weight="500" fill="#5EEAD4" text-anchor="start">10 passed in 0.42s</text><text x="714" y="320" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="15" font-weight="400" fill="#E8EEF9" text-anchor="start">&gt; 為什麼這樣會對？_</text><rect x="714" y="350" width="300" height="12" rx="3" fill="#22314C"/><rect x="714" y="376" width="232" height="12" rx="3" fill="#22314C"/><rect x="714" y="402" width="268" height="12" rx="3" fill="#22314C"/><rect x="714" y="444" width="178" height="32" rx="8" fill="#0C2420" stroke="#5EEAD4" stroke-width="1.2"/><text x="803" y="466" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="11" font-weight="600" fill="#5EEAD4" text-anchor="middle" letter-spacing="1.4">ALL TESTS PASSED</text><text x="714" y="504" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="12" font-weight="400" fill="#F5B84C" text-anchor="start">但你知道它為什麼通過嗎？</text><text x="1010" y="484" font-family="'Noto Serif TC','Songti TC','Noto Serif CJK TC',serif" font-size="190" font-weight="700" fill="#FFFFFF" text-anchor="start" opacity="0.055">?</text></svg>