amily="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="13" font-weight="400" fill="#5D6E88" text-anchor="end" letter-spacing="2.2">THE STEPS AI SKIPPED</text><line x1="52" y1="100" x2="1324" y2="100" stroke="#26354F" stroke-width="1"/><line x1="52" y1="796" x2="1324" y2="796" stroke="#26354F" stroke-width="1"/><text x="64" y="820" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="10.5" font-weight="400" fill="#5D6E88" text-anchor="start" letter-spacing="2">JAY FU · ENGINEERING NOTES</text><text x="1312" y="820" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="10.5" font-weight="400" fill="#5D6E88" text-anchor="end" letter-spacing="2">2026</text><text x="64" y="146" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="14" font-weight="500" fill="#93A4BE" text-anchor="start" letter-spacing="2.6">SPEED × UNDERSTANDING</text><text x="64" y="198" font-family="'Noto Serif TC','Songti TC','Noto Serif CJK TC',serif" font-size="42" font-weight="700" fill="#E8EEF9" text-anchor="start" letter-spacing="0.5">快，不一定代表走得比較遠</text><defs><clipPath id="quadclip"><rect x="270" y="230" width="850" height="420" rx="6"/></clipPath></defs><g clip-path="url(#quadclip)"><rect x="270" y="230" width="850" height="420" rx="0" fill="#0B1220"/><rect x="270" y="230" width="425.0" height="210.0" rx="0" fill="#131F36"/><rect x="695.0" y="230" width="425.0" height="210.0" rx="0" fill="#0C2420"/><rect x="270" y="440.0" width="425.0" height="210.0" rx="0" fill="#0B1220"/><rect x="695.0" y="440.0" width="425.0" height="210.0" rx="0" fill="#201A10"/><line x1="695.0" y1="230" x2="695.0" y2="650" stroke="#26354F" stroke-width="1.4"/><line x1="270" y1="440.0" x2="1120" y2="440.0" stroke="#26354F" stroke-width="1.4"/></g><rect x="270" y="230" width="850" height="420" rx="6" fill="none" stroke="#26354F" stroke-width="1.4"/><text x="310" y="288" font-family="'Noto Serif TC','Songti TC','Noto Serif CJK TC',serif" font-size="34" font-weight="700" fill="#E8EEF9" text-anchor="start">學徒</text><text x="310" y="320" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="16" font-weight="400" fill="#93A4BE" text-anchor="start">慢，但每一步都算數</text><text x="1080" y="288" font-family="'Noto Serif TC','Songti TC','Noto Serif CJK TC',serif" font-size="34" font-weight="700" fill="#5EEAD4" text-anchor="end">理想</text><text x="1080" y="320" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="16" font-weight="400" fill="#5EEAD4" text-anchor="end">快，而且知道為什麼</text><text x="310" y="596" font-family="'Noto Serif TC','Songti TC','Noto Serif CJK TC',serif" font-size="28" font-weight="700" fill="#5D6E88" text-anchor="start">罕見</text><text x="310" y="624" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="15" font-weight="400" fill="#5D6E88" text-anchor="start">慢又不懂，通常撐不久</text><text x="1080" y="596" font-family="'Noto Serif TC','Songti TC','Noto Serif CJK TC',serif" font-size="32" font-weight="700" fill="#F5B84C" text-anchor="end">AI 紅利區</text><text x="1080" y="624" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="15" font-weight="400" fill="#F5B84C" text-anchor="end">效率是真的，成長是借來的</text><line x1="560" y1="408" x2="829.0" y2="408.0" stroke="#5EEAD4" stroke-width="2.2" stroke-dasharray="7 6" stroke-linecap="round"/><polygon points="840,408 829.0,414.1 829.0,401.9" fill="#5EEAD4"/><text x="700" y="394" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="14" font-weight="500" fill="#5EEAD4" text-anchor="middle">原本該走的路</text><path d="M 560 430 Q 760 560 900 512" fill="none" stroke="#F5B84C" stroke-width="2.2" stroke-dasharray="7 7" stroke-linecap="round"/><line x1="880" y1="517" x2="895.6051531921571" y2="511.5982162027148" stroke="#F5B84C" stroke-width="2.2" stroke-linecap="round"/><polygon points="906,508 897.6,517.3 893.6,505.9" fill="#F5B84C"/><line x1="805" y1="534" x2="805" y2="519" stroke="#F5B84C" stroke-width="1.2" stroke-dasharray="3 4"/><rect x="710" y="534" width="190" height="32" rx="8" fill="#0B1220" stroke="#F5B84C" stroke-width="1.1"/><text x="805" y="555" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="14" font-weight="500" fill="#F5B84C" text-anchor="middle">AI 把這條路拉直了</text><text x="228" y="440.0" transform="rotate(-90 228 440.0)" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="13" fill="#93A4BE" letter-spacing="2" text-anchor="middle">理解程度 ↑</text><text x="695.0" y="692" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="13" font-weight="500" fill="#93A4BE" text-anchor="middle" letter-spacing="2">產出速度 →</text><text x="270" y="680" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="14" font-weight="400" fill="#5D6E88" text-anchor="middle">慢</text><text x="1120" y="680" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="14" font-weight="400" fill="#5D6E88" text-anchor="middle">快</text><text x="242" y="650" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="14" font-weight="400" fill="#5D6E88" text-anchor="end">低</text><text x="242" y="240" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="14" font-weight="400" fill="#5D6E88" text-anchor="end">高</text><text x="688" y="750" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="20" font-weight="400" fill="#93A4BE" text-anchor="middle">問題不是快，而是快得不知道自己錯過了什麼。</text></svg>