<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="900" viewBox="0 0 1376 900"><title>任意 SVG、專案契約與 DrawingML 的邊界</title><desc>左側是瀏覽器可接受的任意 SVG，中間是專案契約與品質閘門，右側是可編輯的 DrawingML 物件；filter、mask、foreignObject 與複雜文字排版會被擋下或正規化。</desc><rect x="0" y="0" width="1376" height="900" fill="#0A0A0A"/><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#FFFFFF" opacity="0.06"/></pattern><rect width="1376" height="900" fill="url(#dots)"/><text x="72" y="88" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="50" fill="#F5F5F5" font-weight="700">SVG 不是「任何 SVG 都收」</text><text x="72" y="132" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="26" fill="#9A9A9A">契約是海關：放行可對映的元素，擋下無法保證的表達。</text><text x="1304" y="86" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="13" fill="#5C5C5C" letter-spacing="2" text-anchor="end">CONTRACT / 02</text><line x1="72" y1="154" x2="354" y2="154" stroke="#938BFF" stroke-width="3"/><rect x="72" y="182" width="326" height="500" fill="#131313"/><text x="96" y="218" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="12" fill="#5C5C5C" letter-spacing="2">BROWSER SVG</text><text x="96" y="260" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="34" fill="#F5F5F5" font-weight="700">任意 SVG</text><text x="96" y="290" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="20" fill="#9A9A9A">瀏覽器能畫 ≠ 編譯器能收。</text><rect x="96" y="314" width="136" height="40" fill="#191919" stroke="#2B2B2B" stroke-width="1" rx="3"/><text x="110" y="341" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="20" fill="#D1D5DB">&lt;text&gt;</text><rect x="246" y="314" width="136" height="40" fill="#191919" stroke="#2B2B2B" stroke-width="1" rx="3"/><text x="260" y="341" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="20" fill="#D1D5DB">&lt;rect&gt;</text><rect x="96" y="368" width="136" height="40" fill="#191919" stroke="#2B2B2B" stroke-width="1" rx="3"/><text x="110" y="395" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="20" fill="#D1D5DB">&lt;path&gt;</text><rect x="246" y="368" width="136" height="40" fill="#191919" stroke="#2B2B2B" stroke-width="1" rx="3"/><text x="260" y="395" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="20" fill="#D1D5DB">&lt;image&gt;</text><rect x="96" y="422" width="136" height="40" fill="#191919" stroke="#2B2B2B" stroke-width="1" rx="3"/><text x="110" y="449" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="20" fill="#D1D5DB">&lt;g&gt;</text><rect x="246" y="422" width="136" height="40" fill="#191919" stroke="#2B2B2B" stroke-width="1" rx="3"/><text x="260" y="449" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="20" fill="#D1D5DB">&lt;use&gt;</text><line x1="96" y1="492" x2="374" y2="492" stroke="#2B2B2B" stroke-width="1"/><text x="96" y="522" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="20" fill="#FF7A7A" font-weight="700">契約外</text><rect x="96" y="534" width="278" height="116" fill="#1C1111" stroke="#5A2A2A" stroke-width="1" rx="3"/><text x="110" y="566" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" fill="#FF7A7A">× filter   × mask</text><text x="110" y="598" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" fill="#FF7A7A">× foreignObject</text><text x="110" y="630" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="18" fill="#FF7A7A">× 複雜文字排版</text><rect x="438" y="182" width="500" height="500" fill="#191919" stroke="#938BFF" stroke-width="1.5"/><text x="462" y="218" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="12" fill="#938BFF" letter-spacing="2">CONTRACT GATE</text><text x="462" y="260" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="34" fill="#F5F5F5" font-weight="700">專案契約</text><text x="462" y="290" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="20" fill="#9A9A9A">不是轉檔器，是一組可驗證的邊界。</text><rect x="462" y="314" width="452" height="64" fill="#0A0A0A" stroke="#2B2B2B" stroke-width="1" rx="3"/><text x="480" y="355" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" fill="#938BFF" font-weight="700">01</text><text x="522" y="341" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="24" fill="#F5F5F5" font-weight="700">元素白名單</text><text x="522" y="366" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="18" fill="#9A9A9A">只允許可對映到 DrawingML 的元素。</text><rect x="462" y="396" width="452" height="64" fill="#0A0A0A" stroke="#2B2B2B" stroke-width="1" rx="3"/><text x="480" y="437" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" fill="#938BFF" font-weight="700">02</text><text x="522" y="423" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="24" fill="#F5F5F5" font-weight="700">屬性與單位</text><text x="522" y="448" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="18" fill="#9A9A9A">座標、數值、transform 先正規化。</text><rect x="462" y="478" width="452" height="64" fill="#0A0A0A" stroke="#2B2B2B" stroke-width="1" rx="3"/><text x="480" y="519" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" fill="#938BFF" font-weight="700">03</text><text x="522" y="505" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="24" fill="#F5F5F5" font-weight="700">metadata／結構</text><text x="522" y="530" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="18" fill="#9A9A9A">頁面、圖層、文字框有固定約定。</text><rect x="462" y="560" width="452" height="64" fill="#0A0A0A" stroke="#2B2B2B" stroke-width="1" rx="3"/><text x="480" y="601" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="18" fill="#938BFF" font-weight="700">04</text><text x="522" y="587" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="24" fill="#F5F5F5" font-weight="700">DrawingML 對映</text><text x="522" y="612" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="18" fill="#9A9A9A">每個節點不是有目標物件，就是被拒絕。</text><rect x="978" y="182" width="326" height="500" fill="#131313"/><text x="1002" y="218" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="12" fill="#5C5C5C" letter-spacing="2">NATIVE PPTX</text><text x="1002" y="260" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="34" fill="#F5F5F5" font-weight="700">DrawingML</text><text x="1002" y="290" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="18" fill="#9A9A9A">文字、形狀、圖表、圖片。</text><rect x="1002" y="314" width="278" height="64" fill="#0A0A0A" stroke="#2B2B2B" stroke-width="1" rx="3"/><text x="1022" y="355" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="26" fill="#C7C2FF" font-weight="700">文字</text><text x="1084" y="355" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="20" fill="#D1D5DB">→  text run</text><rect x="1002" y="396" width="278" height="64" fill="#0A0A0A" stroke="#2B2B2B" stroke-width="1" rx="3"/><text x="1022" y="437" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="26" fill="#C7C2FF" font-weight="700">形狀</text><text x="1084" y="437" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="20" fill="#D1D5DB">→  shape</text><rect x="1002" y="478" width="278" height="64" fill="#0A0A0A" stroke="#2B2B2B" stroke-width="1" rx="3"/><text x="1022" y="519" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="26" fill="#C7C2FF" font-weight="700">圖表</text><text x="1084" y="519" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="20" fill="#D1D5DB">→  native chart</text><rect x="1002" y="560" width="278" height="64" fill="#0A0A0A" stroke="#2B2B2B" stroke-width="1" rx="3"/><text x="1022" y="601" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="26" fill="#C7C2FF" font-weight="700">圖片</text><text x="1084" y="601" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="20" fill="#D1D5DB">→  picture</text><text x="72" y="742" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="24" fill="#D1D5DB" font-style="italic">&quot;SVG adapts to PPT Master; PPT Master does not expand to follow the entire SVG standard.&quot;</text><text x="72" y="772" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="18" fill="#5C5C5C">— 官方文件</text><text x="72" y="832" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="22" fill="#9A9A9A">契約外不等於一定失敗：有些會被正規化，有些會在品質閘門被擋下。</text></svg>