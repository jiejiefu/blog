<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="980" viewBox="0 0 1376 980"><title>四種 AI 簡報做法的 2×2 定位圖</title><desc>HTML／Playwright 截圖、整頁圖片加隱形文字、python-pptx 填空與 PPT Master，依版面自由度與可編輯性做質性定位。</desc><rect x="0" y="0" width="1376" height="980" fill="#0A0A0A"/><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#FFFFFF" opacity="0.06"/></pattern><rect width="1376" height="980" fill="url(#dots)"/><text x="72" y="88" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="52" fill="#F5F5F5" font-weight="700">四種 AI 簡報做法</text><text x="72" y="132" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="28" fill="#9A9A9A">版面自由度 × 可編輯性</text><text x="1304" y="86" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="13" fill="#5C5C5C" letter-spacing="2" text-anchor="end">QUALITATIVE MAP / 01</text><line x1="72" y1="154" x2="332" y2="154" stroke="#938BFF" stroke-width="3"/><rect x="150" y="210" width="550.0" height="255.0" fill="#131313" opacity="0.72"/><rect x="700.0" y="210" width="550.0" height="255.0" fill="#131313" opacity="0.42"/><rect x="150" y="465.0" width="550.0" height="255.0" fill="#131313" opacity="0.28"/><rect x="700.0" y="465.0" width="550.0" height="255.0" fill="#131313" opacity="0.52"/><line x1="150" y1="720" x2="1250" y2="720" stroke="#3A3A3A" stroke-width="1.5"/><line x1="150" y1="210" x2="150" y2="720" stroke="#3A3A3A" stroke-width="1.5"/><line x1="700.0" y1="210" x2="700.0" y2="720" stroke="#2B2B2B" stroke-width="1" stroke-dasharray="5 8" opacity="0.8"/><line x1="150" y1="465.0" x2="1250" y2="465.0" stroke="#2B2B2B" stroke-width="1" stroke-dasharray="5 8" opacity="0.8"/><path d="M1250 720l-9 -4v8z" fill="#3A3A3A"/><path d="M150 210l-4 9h8z" fill="#3A3A3A"/><text x="178" y="250" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="22" fill="#5C5C5C">自由，但難改</text><text x="1222" y="250" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="22" fill="#C7C2FF" text-anchor="end">自由且可編輯</text><text x="178" y="696" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="22" fill="#5C5C5C">兩邊都不足</text><text x="1222" y="696" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="22" fill="#5C5C5C" text-anchor="end">可編輯，但版面受限</text><g transform="translate(96 465) rotate(-90)"><text x="0" y="0" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="24" fill="#9A9A9A" text-anchor="middle">版面自由度</text></g><text x="150" y="752" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="20" fill="#5C5C5C">低</text><text x="1250" y="752" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="20" fill="#5C5C5C" text-anchor="end">高</text><text x="700.0" y="780" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="24" fill="#9A9A9A" text-anchor="middle">可編輯性 →</text><circle cx="330" cy="300" r="27" fill="#191919" stroke="#2B2B2B" stroke-width="1.5"/><text x="330" y="308" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="23" fill="#F5F5F5" font-weight="700" text-anchor="middle">1</text><text x="365" y="307" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="22" fill="#D1D5DB">截圖</text><circle cx="480" cy="405" r="27" fill="#191919" stroke="#2B2B2B" stroke-width="1.5"/><text x="480" y="413" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="23" fill="#F5F5F5" font-weight="700" text-anchor="middle">2</text><text x="480" y="357" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="22" fill="#D1D5DB" text-anchor="middle">隱形文字</text><circle cx="860" cy="585" r="27" fill="#191919" stroke="#2B2B2B" stroke-width="1.5"/><text x="860" y="593" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="23" fill="#F5F5F5" font-weight="700" text-anchor="middle">3</text><text x="860" y="535" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="22" fill="#D1D5DB" text-anchor="middle">python-pptx</text><circle cx="1055" cy="350" r="43" fill="#938BFF" opacity="0.10"/><circle cx="1055" cy="350" r="27" fill="#938BFF" stroke="#938BFF" stroke-width="1.5"/><text x="1055" y="358" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="23" fill="#0A0A0A" font-weight="700" text-anchor="middle">4</text><text x="1055" y="292" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="22" fill="#C7C2FF" text-anchor="middle">PPT Master</text><circle cx="164" cy="812" r="27" fill="#191919" stroke="#2B2B2B" stroke-width="1.5"/><text x="164" y="820" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="23" fill="#F5F5F5" font-weight="700" text-anchor="middle">1</text><text x="204" y="820" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="26" fill="#F5F5F5" font-weight="700">HTML／Playwright 截圖</text><text x="204" y="851" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="22" fill="#9A9A9A">版面最自由，但文字與圖表不能改。</text><circle cx="734" cy="812" r="27" fill="#191919" stroke="#2B2B2B" stroke-width="1.5"/><text x="734" y="820" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="23" fill="#F5F5F5" font-weight="700" text-anchor="middle">2</text><text x="774" y="820" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="26" fill="#F5F5F5" font-weight="700">整頁圖片＋隱形文字</text><text x="774" y="851" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="22" fill="#9A9A9A">demo 最像，改一個字就破功。</text><circle cx="164" cy="884" r="27" fill="#191919" stroke="#2B2B2B" stroke-width="1.5"/><text x="164" y="892" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="23" fill="#F5F5F5" font-weight="700" text-anchor="middle">3</text><text x="204" y="892" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="26" fill="#F5F5F5" font-weight="700">python-pptx 填空</text><text x="204" y="923" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="22" fill="#9A9A9A">原生可編輯，複雜圖形要手寫座標。</text><circle cx="734" cy="884" r="27" fill="#938BFF" stroke="#938BFF" stroke-width="1.5"/><text x="734" y="892" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="23" fill="#0A0A0A" font-weight="700" text-anchor="middle">4</text><text x="774" y="892" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="26" fill="#C7C2FF" font-weight="700">PPT Master</text><text x="774" y="923" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="22" fill="#9A9A9A">兩者兼顧，但需要來源材料與 review。</text><text x="72" y="958" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="18" fill="#5C5C5C">定位是相對的，不是評分。</text><text x="1304" y="958" font-family="'PingFang TC','Noto Sans TC','Heiti TC',sans-serif" font-size="18" fill="#5C5C5C" text-anchor="end">質性示意，非量測</text></svg>